[theme]
base = "light"
primaryColor = "#0e5a36"
backgroundColor = "#f8faf9"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[server]
fileWatcherType = "none"
runOnSave = false
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
